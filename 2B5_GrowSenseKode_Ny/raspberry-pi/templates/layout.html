<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <title>{% block title %}{% endblock %} - Væksthus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .card { margin-bottom: 1rem; }
        .sensor-value { font-size: 1.6rem; font-weight: bold; }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('hjem') }}">GrowSense</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <div class="navbar-nav">
                    <a class="nav-link" href="{{ url_for('hjem') }}">Oversigt</a>
                    <a class="nav-link" href="{{ url_for('sensorer') }}">Sensorer</a>
                    <a class="nav-link" href="{{ url_for('styring') }}">Styring</a>
                    <a class="nav-link" href="{{ url_for('profiler') }}">Profiler</a>
                    <a class="nav-link" href="{{ url_for('kamera') }}">Kamera</a>
                    <a class="nav-link" href="{{ url_for('galleri') }}">Galleri</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
        <hr />
        <footer class="text-muted text-center pb-3">
            <small>&copy; GrowSense &ndash; IT - Teknolog</small>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
